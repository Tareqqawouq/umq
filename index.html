<style>
/* Layout: operations console. Top status bar · side navigation (right, RTL) · main column = live 3D stage + page content. One committed dark "night shift" look. */
:root{
  --ink:#0c161c; --ink-2:#121f27; --ink-3:#192b36; --line:#29404d; --line-2:#36535f;
  --text:#eee9dd; --muted:#97a9b0;
  --hivis:#ff7a1a; --brass:#dcb05a; --water:#5bbbe0;
  --good:#6cc28d; --warn:#f0bf4c; --bad:#ef5f52;
  --f:"Cairo","Segoe UI",Tahoma,system-ui,sans-serif;
  --mono:"IBM Plex Mono","Cairo",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--f);font-size:15px;line-height:1.6;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;transition:transform .08s,filter .08s}
button:active:not(:disabled),[data-act]:active{transform:scale(.95);filter:brightness(1.35)}
html{-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--hivis);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:plaintext}
.muted{color:var(--muted)}
h1,h2,h3{text-wrap:balance}

.app{height:100%;display:flex;flex-direction:column}
/* top bar */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--ink-2)}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.brand b{font-size:26px;font-weight:800;line-height:1}
.brand b i{font-style:normal;color:var(--hivis)}
.brand span{color:var(--muted);font-size:13px}
.kpis{display:flex;gap:8px;flex-wrap:wrap}
.kpi{display:flex;flex-direction:column;padding:2px 12px;border-inline-start:1px solid var(--line);min-width:100px}
.kpi label{font-size:12px;color:var(--muted);font-weight:600}
.kpi b{font-family:var(--mono);font-size:17px;font-weight:600;direction:ltr;unicode-bidi:plaintext;text-align:right}
.kpi b.neg{color:var(--bad)} .kpi b.pos{color:var(--good)}
.pips{display:flex;gap:4px;padding-top:6px;direction:ltr;justify-content:flex-end}
.pips span{width:11px;height:11px;transform:rotate(45deg) scale(.8);border:1.5px solid var(--brass)}
.pips span.on{background:var(--brass)}
.clock{display:flex;flex-direction:column;padding:2px 12px;border-inline-start:1px solid var(--line)}
.clock b{font-size:14px;font-weight:700}
.clock span{font-family:var(--mono);font-size:13px;color:var(--muted)}
.tbtn{background:var(--ink-3);border:1px solid var(--line);border-radius:var(--r);padding:7px 12px;font-weight:600;font-size:14px;position:relative}
.tbtn:hover{border-color:var(--line-2)}
.tbtn .badge{position:absolute;top:-6px;inset-inline-end:-6px}
.badge{background:var(--hivis);color:#1a0d02;border-radius:10px;font-size:11px;font-family:var(--mono);padding:0 6px;line-height:18px;font-weight:600}

/* shell */
.shell{flex:1;min-height:0;display:grid;grid-template-columns:212px minmax(0,1fr)}
.side{border-inline-end:1px solid var(--line);background:var(--ink-2);padding:12px 10px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.side button{display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:var(--r);padding:10px 12px;color:var(--muted);font-weight:600;font-size:15px;text-align:start;position:relative}
.side button svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side button:hover{background:var(--ink-3);color:var(--text)}
.side button[aria-current="page"]{background:var(--ink-3);color:var(--text);box-shadow:inset -3px 0 0 var(--hivis)}
.side button .badge{margin-inline-start:auto}
.side .foot{margin-top:auto;padding:10px 12px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.main{overflow-y:auto;min-height:0;padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}

/* stage */
.stage{position:relative;height:clamp(300px,50vh,580px);border-radius:12px;overflow:hidden;background:#0a1318;border:1px solid var(--line);flex:none}
#stage3d{position:absolute;inset:0}
#stage3d canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage3d canvas:active{cursor:grabbing}
.no3d{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);padding:20px;text-align:center}
.hud{position:absolute;top:12px;inset-inline-start:12px;max-width:min(380px,calc(100% - 24px));background:rgba(10,18,23,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.hud .eyebrow{font-size:12px;color:var(--brass);font-weight:700;letter-spacing:.02em}
.hud h2{margin:0;font-size:19px;font-weight:700;line-height:1.35}
.hud .line{display:flex;justify-content:space-between;gap:14px;font-size:13.5px}
.hud .line span:first-child{color:var(--muted)}
.hud .bar{height:7px}
.daybadge{position:absolute;top:12px;inset-inline-end:12px;background:rgba(10,18,23,.7);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:4px 12px;font-size:12.5px;pointer-events:none}
.stabs{position:absolute;bottom:12px;inset-inline-start:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 24px)}
.stabs button{background:rgba(10,18,23,.78);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.stabs button[aria-pressed="true"]{border-color:var(--hivis);color:#ffd2b0}
.fhint{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:12.5px;font-weight:700;color:#eee9dd;background:rgba(10,18,23,.72);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:5px 12px;pointer-events:none;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}.fhint.on{background:rgba(255,122,26,.9);color:#fff}
.draghint{position:absolute;bottom:14px;inset-inline-end:14px;font-size:12px;color:rgba(238,233,221,.6);pointer-events:none}

/* page */
.pg-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pg-h h1{margin:0;font-size:24px;font-weight:800;line-height:1.3}
.pg-h p{margin:2px 0 0;color:var(--muted);font-size:14px}
.card{background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-h h2{margin:0;font-size:16.5px;font-weight:700}
.g2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.sec-t{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.02em;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hint{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,transparent,rgba(255,122,26,.10));border:1px solid rgba(255,122,26,.38);border-radius:10px;padding:10px 14px;font-size:14.5px}
.hint .tag{color:var(--hivis);font-weight:800;white-space:nowrap}
.hint p{margin:0;flex:1;min-width:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:1px 10px;border-radius:20px;border:1px solid currentColor;white-space:nowrap;line-height:1.7}
.chip.water{color:var(--water)} .chip.oil{color:var(--brass)} .chip.good{color:var(--good)} .chip.warn{color:var(--warn)} .chip.bad{color:var(--bad)} .chip.hv{color:var(--hivis)} .chip.mut{color:var(--muted)}
.bar{height:6px;background:#0a1318;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--hivis);border-radius:4px}
.btn{background:var(--ink-3);border:1px solid var(--line-2);border-radius:var(--r);padding:8px 14px;font-weight:700;font-size:14px}
.btn:hover:not(:disabled){border-color:var(--text)}
.btn.pri{background:var(--hivis);border-color:var(--hivis);color:#1a0d02}
.btn.pri:hover:not(:disabled){background:#ff8f3d}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:13px}
.lnk{background:none;border:0;color:var(--hivis);font-weight:700;font-size:13.5px;padding:0}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{color:var(--muted);font-size:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.fact{display:flex;flex-direction:column;background:var(--ink-3);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}
.fact label{font-size:12px;color:var(--muted);font-weight:600}
.fact b{font-size:16px;font-weight:700}
.fact b.num{font-weight:600}
.strata{display:flex;height:10px;border-radius:3px;overflow:hidden;direction:ltr}
.strata span{height:100%}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;color:var(--muted);font-weight:700;text-align:start;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;text-align:right;white-space:nowrap}
.tbl .nm{font-weight:700}
.tbl .u{display:block;font-size:12px;color:var(--muted);font-weight:500}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:rgba(255,255,255,.02)}
.opsrow{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--ink-3);cursor:pointer;text-align:start;width:100%}
.opsrow:hover{border-color:var(--line-2)}
.opsrow.sel{border-color:var(--hivis)}
.opsrow h3{margin:0;font-size:15px;font-weight:700}
.loglist{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.loglist div{display:flex;gap:10px}
.loglist time{font-family:var(--mono);color:var(--muted);white-space:nowrap;font-size:12px;padding-top:2px;direction:ltr;min-width:84px;text-align:right}
.loglist .good{color:var(--good)} .loglist .warn{color:var(--warn)} .loglist .bad{color:var(--bad)}
.jobtabs{display:flex;gap:8px;flex-wrap:wrap}
.jobtabs button{background:var(--ink-2);border:1px solid var(--line);border-radius:20px;padding:5px 14px;font-weight:700;font-size:14px}
.jobtabs button[aria-pressed="true"]{border-color:var(--hivis);color:#ffd2b0}
.offer h3{margin:0;font-size:16px;font-weight:700}
.offer .sub{color:var(--muted);font-size:13.5px}
.fmlist{display:flex;flex-direction:column;gap:2px}
.fm{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.fm:last-child{border-bottom:0}
.fm i{width:14px;height:14px;border-radius:3px;margin-top:4px}
.fm b{font-weight:700}
.fm small{display:block;color:var(--muted);font-size:12.5px}
.fm .rk{font-size:12px;color:var(--warn)}

/* map */
.mapbox{position:relative;aspect-ratio:10/7;width:100%;max-width:100%;border-radius:var(--r);overflow:hidden;background:#0a1318}
.mapbox canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.tip{position:absolute;pointer-events:none;background:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;font-size:13px;min-width:170px;box-shadow:0 8px 24px rgba(0,0,0,.45);z-index:3}
.tip b{display:block;font-size:14px}

/* section + console */
.xbox{position:relative;height:420px;border-radius:var(--r);overflow:hidden;background:#0a1318}
.xbox canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.con-g{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center}
.ring{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--rc,var(--hivis)) calc(var(--p,0)*1%),#0a1318 0)}
.ring::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--ink-2)}
.ring div{position:relative;z-index:1;text-align:center;line-height:1.1}
.ring b{font-family:var(--mono);font-size:21px;font-weight:600;display:block}
.ring small{font-size:11.5px;color:var(--muted)}
.cstats{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.cstats .row span:last-child{font-family:var(--mono);direction:ltr;unicode-bidi:plaintext}
.ctl{display:flex;flex-direction:column;gap:2px}
.ctl label{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.ctl label span{font-family:var(--mono);font-weight:500;color:var(--brass);direction:ltr}
.ctl input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;direction:ltr;margin:0}
.ctl input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:repeating-linear-gradient(90deg,#28434f 0 1px,#0a1318 1px 10%)}
.ctl input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:repeating-linear-gradient(90deg,#28434f 0 1px,#0a1318 1px 10%)}

function rng(){let t=(S.seed=(S.seed+0x6D2B79F5)|0);t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;}

/* ======================= TIME & FORMAT ======================= */
const money=n=>(n<0?'−$':'$')+Math.abs(Math.round(n)).toLocaleString('en-US');
const num=n=>Math.round(n).toLocaleString('en-US');
const AR_DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const realOf=t=>new Date(S.start+t*3.6e6/SCALE);
const hm=d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
function when(t){const d=realOf(t),now=new Date(),tm=new Date(now.getTime()+864e5);
  const lbl=d.toDateString()===now.toDateString()?'اليوم':d.toDateString()===tm.toDateString()?'بكرا':AR_DAYS[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1);return lbl+' '+hm(d);}
function stamp(t){const d=realOf(t);return AR_DAYS[d.getDay()]+' '+hm(d);}
function dur(h){if(h<0)h=0;const m=Math.round(h*60);if(m<60)return Math.max(1,m)+' د';const H=Math.floor(m/60),M=m%60;if(H<24)return H+' س'+(M?' '+M+' د':'');const D=Math.floor(H/24),hh=H%24;return D+' يوم'+(hh?' '+hh+' س':'');}
const opDay=t=>Math.floor(t/24)+1;
function layerAt(job,d){for(const l of job.layers)if(d>=l.from&&d<l.to)return l;return job.layers[job.layers.length-1];}
function cargoWeight(c){let w=0;for(const k of ITEM_KEYS)w+=(c[k]||0)*ITEMS[k].w;return w;}
function inTransit(jobId){const c=emptyStock();for(const t of S.trucks)if(t.mission==='supply'&&t.dest===jobId&&(t.state==='loading'||t.state==='out'))for(const k of ITEM_KEYS)c[k]+=t.cargo[k];return c;}
const jobRigKind=job=>job.kind==='oil'?'oil':'water';

/* ======================= DRILLING MODEL ======================= */
const hardOf=fm=>clamp(fm.ucs/40,0.5,5);
function opt(fm){const h=hardOf(fm);return{wob:Math.round(18+h*15),rpm:Math.round(92-h*13),pump:Math.round(30+h*6+(fm.swell?10:0))};}
function ctlOf(r){return r.ctl||(r.ctl={wob:30,rpm:78,pump:45});}
function effAt(c,fm){const o=opt(fm);return Math.exp(-Math.pow((c.wob-o.wob)/26,2)-Math.pow((c.rpm-o.rpm)/28,2));}
function wearMul(c,fm){const o=opt(fm);return 1+Math.pow(Math.max(0,c.wob-o.wob)/22,2)+Math.pow(Math.max(0,c.rpm-o.rpm)/26,2);}
function ropFor(kind,bitType,fm,e){return fm.rop*RIG[kind].mult*BIT[bitType].ropF(fm)*(1+0.12*S.crew)*(0.3+0.85*e);}
function fracMul(job,l){const fm=FM[l.r];if(!fm.frac)return 1;const f=job.flags['l'+l.from];return f==='lcm'?1.2:f==='low'?2:1+2*fm.frac;}
/* resource needs to finish a job */
function needs(job){
  const R=RIG[jobRigKind(job)],rig=job.rig?rigById(job.rig):null;
  const remain=Math.max(0,job.target-job.depth);let mud=0,wear=0;const bt=S.pdc?'bitP':'bitT';
  for(const l of job.layers){const a=Math.max(l.from,job.depth),b=Math.min(l.to,job.target);if(b<=a)continue;const fm=FM[l.r];mud+=(b-a)*R.mpm*(fm.frac?1+2*fm.frac:1);wear+=(b-a)*BIT[bt].wear(fm);}
  const cur=rig&&rig.jobId===job.id?Math.max(0,rig.bit.life):0;
  const bits=Math.max(0,Math.ceil((wear-cur)/100));
  const casing=Math.max(0,Math.ceil((job.target-R.open-job.cased)/ITEMS[R.casing].len));
  return {diesel:remain*R.dpm*1.08,mud:mud*1.15+30,[R.casing]:casing,[bt]:bits,remain};
}
/* metres the current site stock can carry */
function reach(job){
  const R=RIG[jobRigKind(job)],st=job.stock,out={};
  out.diesel=st.diesel/R.dpm;
  let m=st.mud,d=job.depth;
  while(m>0&&d<job.target){const l=layerAt(job,d);const per=R.mpm*fracMul(job,l);const seg=Math.min(l.to,job.target)-d;const can=m/per;if(can>=seg){m-=seg*per;d+=seg;}else{d+=can;m=0;}}
  out.mud=d-job.depth;
  out.casing=Math.max(0,job.cased+st[R.casing]*ITEMS[R.casing].len+R.open-job.depth);
  const rig=job.rig?rigById(job.rig):null;let life=(rig&&rig.jobId===job.id?Math.max(0,rig.bit.life):0)+(st.bitT+st.bitP)*100;d=job.depth;
  const bt=st.bitP>0||(rig&&rig.bit.type==='bitP')?'bitP':'bitT';
  while(life>0&&d<job.target){const l=layerAt(job,d);const wr=BIT[bt].wear(FM[l.r]);const seg=Math.min(l.to,job.target)-d;const can=life/wr;if(can>=seg){life-=seg*wr;d+=seg;}else{d+=can;life=0;}}
  out.bits=d-job.depth;return out;
}
/* forecast drilling hours per formation (planning sheet) */
function layerPlan(job,kind){
  kind=kind||jobRigKind(job);const bt=S.pdc?'bitP':'bitT';const e=S.autoDrill?0.85:0.8;
  return job.layers.filter(l=>l.from<job.target).map(l=>{const fm=FM[l.r],a=l.from,b=Math.min(l.to,job.target);const rop=ropFor(kind,bt,fm,e);return{l,fm,a,b,rop,h:(b-a)/rop};});
}
function estFinish(job){
  const rig=job.rig?rigById(job.rig):null;if(!rig||rig.jobId!==job.id)return null;
  const R=RIG[rig.kind];let h=0;
  if(rig.state==='moving')h+=Math.max(0,rig.t1-S.t)+R.rigup;else if(['rigup','wait','tripping','casing'].includes(rig.state))h+=Math.max(0,rig.t1-S.t);
  const c=ctlOf(rig);let wear=0;
  for(const l of job.layers){const a=Math.max(l.from,job.depth),b=Math.min(l.to,job.target);if(b<=a)continue;const fm=FM[l.r];const e=S.autoDrill&&rig.auto!==false?0.85:(l===layerAt(job,job.depth)?effAt(c,fm):0.75);h+=(b-a)/ropFor(rig.kind,rig.bit.type,fm,e);wear+=(b-a)*BIT[rig.bit.type].wear(fm);}
  const trips=Math.max(0,Math.ceil((wear-Math.max(0,rig.bit.life))/100));h+=trips*(R.trip+(job.depth+job.target)/2/R.tripRate);
  h+=Math.max(0,Math.ceil((job.target-R.open-job.cased)/ITEMS[R.casing].len))*R.ctime;
  return h;
}

/* ======================= CONTRACTS ======================= */
function genLayers(site,target,kind){
  const g=site.geo;const out=[];let d=0;const push=(r,th)=>{out.push({r,from:d,to:d+th});d+=th;};
  if(kind==='oil'){
    push('alluv',ri(10,25));push('shall',ri(80,140));push('rijam',ri(110,170));push('muwq',ri(180,280));push('amman',ri(90,140));push('wsir',ri(100,150));push('shueib',ri(90,140));push('naur',ri(140,220));
    if(rng()<.6)push('kurnub',ri(180,260));else push('trias',ri(160,240));
    const resTop=d;push('res',ri(250,400));
    return{layers:out,target:Math.round((resTop+ri(60,140))/10)*10};
  }
  if(g==='basalt'){push('basalt',ri(35,90));push(pick(['shall','muwq']),ri(30,70));push('rijam',ri(140,200));}
  else if(g==='marl'){push('alluv',ri(10,30));push('muwq',ri(80,150));push('amman',ri(120,180));push('wsir',ri(150,250));}
  else{push('alluv',ri(6,20));push('shall',ri(40,90));push('rijam',ri(120,180));push('muwq',ri(100,160));push('amman',ri(120,180));}
  // water target: inside the first or second aquifer
  const aqs=out.filter(l=>FM[l.r].aq);const aq=rng()<.65?aqs[0]:(aqs[1]||aqs[0]);
  target=Math.round((aq.from+Math.min(aq.to-aq.from-10,ri(25,80)))/10)*10;
  return{layers:out,target};
}
function genContract(){
  const hasOil=S.rigs.some(r=>r.kind==='oil');const oil=hasOil&&rng()<0.35;const kind=oil?'oil':'water';
  const busy=new Set(S.jobs.filter(j=>j.state!=='done').map(j=>j.site));
  const cands=SITES.filter(s=>s.kind===kind&&!busy.has(s.id));if(!cands.length)return;
  const s=pick(cands),d=kmBetween(DEPOT,s);const {layers,target}=genLayers(s,0,kind);
  const hrs=layerPlan({layers,target},kind).reduce((a,p)=>a+p.h,0);
  let reward,days,title;
  if(kind==='water'){reward=Math.round((hrs*620+target*60+d*120+ri(0,30)*100)/500)*500;days=Math.ceil((hrs*1.5+24)/24)+2;title=pick(['بئر ري زراعي','بئر مياه شرب','بئر بديل لبئر جاف','بئر لسقاية المواشي','بئر لمشروع سكني']);}
  else{reward=Math.round((target*250+hrs*900+d*500)/5000)*5000;days=Math.ceil(hrs*1.6/24)+6;title=pick(['بئر تطويري','بئر استكشافي','بئر إنتاج']);}
  const job=mkJob(s.id,pick(CLIENTS[kind]),title,kind,target,reward,days,layers,kind==='oil'?{rep:3,rig:'oil'}:{});
  job.expires=S.t+ri(3,6)*24;S.jobs.push(job);
  log('عرض عقد جديد: '+job.title+' في «'+s.name+'» بعمق '+target+' م وقيمة '+money(reward)+'.','info');
}

/* ======================= ACTIONS ======================= */
function canAccept(job){
  if(job.req.rep&&S.rep<job.req.rep)return 'يحتاج سمعة '+job.req.rep+' نجوم';
  if(job.req.rig&&!S.rigs.some(r=>r.kind===job.req.rig))return 'يحتاج حفارة نفط';
  if(S.jobs.filter(j=>j.state==='active').length>=4)return 'عندك 4 عقود نشطة';
  return null;
}
function acceptJob(id){const j=jobById(id);if(!j||j.state!=='offer'||canAccept(j))return;j.state='active';j.deadline=S.t+j.days*24;j.expires=null;S.sel=j.id;S.focus=null;log('تم توقيع عقد «'+siteById(j.site).name+'». التسليم قبل '+when(j.deadline)+'.','good');save();}
function sendRig(jobId,rigId){
  const j=jobById(jobId),r=rigById(rigId);if(!j||!r||r.jobId||j.rig||r.state!=='idle'||r.kind!==jobRigKind(j))return;
  const s=siteById(j.site),km=Math.hypot(r.x-s.x,r.y-s.y)*KM*ROAD;
  r.state='moving';r.home=false;r.from={x:r.x,y:r.y};r.to={x:s.x,y:s.y};r.t0=S.t;r.t1=S.t+moveH(r.kind,km);r.km=km;r.jobId=j.id;r.at=null;j.rig=r.id;S.focus=null;S.sel=j.id;
  log('الحفارة «'+r.name+'» انطلقت إلى «'+s.name+'» ('+Math.round(km)+' كم، توصل '+when(r.t1)+').','info');save();
}
function rigHome(rigId){const r=rigById(rigId);if(!r||r.state!=='idle'||r.at==='depot'||r.jobId)return;const km=Math.hypot(r.x-DEPOT.x,r.y-DEPOT.y)*KM*ROAD;
  r.state='moving';r.home=true;r.from={x:r.x,y:r.y};r.to={x:DEPOT.x,y:DEPOT.y};r.t0=S.t;r.t1=S.t+moveH(r.kind,km);r.km=km;r.at=null;S.focus={type:'rig',id:r.id};log('الحفارة «'+r.name+'» راجعة للقاعدة.','info');}
function dispatch(truckId,jobId,cargo){
  const t=truckById(truckId),j=jobById(jobId);if(!t||t.state!=='idle'||!j||j.state!=='active')return false;
  const w=cargoWeight(cargo);if(w<=0||w>t.cap+1e-6)return false;
  for(const k of ITEM_KEYS)if((cargo[k]||0)>S.depot[k])return false;
  for(const k of ITEM_KEYS){S.depot[k]-=cargo[k]||0;t.cargo[k]=cargo[k]||0;}
  const s=siteById(j.site),km=kmBetween(DEPOT,s);
  t.state='loading';t.mission='supply';t.dest=j.id;t.hours=truckH(km);t.km=km;t.t0=S.t;t.t1=S.t+T_LOAD;
  const cost=Math.round(km*2*1.1);S.cash-=cost;todayCost(cost);
  log('«'+t.name+'» تحمّل '+w.toFixed(1)+' طن إلى «'+s.name+'». توصل حوالي '+when(S.t+T_LOAD+t.hours)+'.','info');save();return true;
}
function serviceWell(wellId){
  const w=wellById(wellId);if(!w||w.svc)return;const t=S.trucks.find(x=>x.state==='idle');if(!t){toast('ما في شاحنة فاضية','كل الشاحنات مشغولة.','warn');return;}
  const cost=w.kind==='oil'?3200:450;if(S.cash<cost){toast('الرصيد لا يكفي','الصيانة تكلف '+money(cost)+'.','bad');return;}
  S.cash-=cost;todayCost(cost);const s=siteById(w.site),km=kmBetween(DEPOT,s);
  t.state='loading';t.mission='service';t.dest=w.id;t.hours=truckH(km);t.km=km;t.t0=S.t;t.t1=S.t+T_LOAD;w.svc=true;log('فريق صيانة على «'+t.name+'» متجه إلى بئر «'+s.name+'».','info');
}
function buy(item,qty){const it=ITEMS[item];if(item==='bitP'&&!S.pdc)return;const cost=it.price*qty;if(S.cash<cost){toast('الرصيد لا يكفي','الشراء يكلف '+money(cost)+'.','bad');return;}S.cash-=cost;todayCost(cost);S.depot[item]+=qty;}
function owned(id){if(id==='rig2')return S.rigs.filter(r=>r.kind==='water').length>=2;if(id==='oilrig')return S.rigs.some(r=>r.kind==='oil');if(id==='pdc')return S.pdc;if(id==='auto')return S.autoDrill;if(id==='crew')return S.crew>=4;return false;}
function buyUpg(id){const u=UPG.find(x=>x.id===id),c=u.cost();if(owned(id))return;if(S.cash<c){toast('الرصيد لا يكفي','تحتاج '+money(c)+'.','bad');return;}
  S.cash-=c;todayCost(c);
  if(id==='truck')S.trucks.push(mkTruck('شاحنة '+(S.trucks.length+1),12));
  if(id==='heavy')S.trucks.push(mkTruck('شاحنة ثقيلة '+(S.trucks.filter(t=>t.cap>12).length+1),30));
  if(id==='rig2')S.rigs.push(mkRig('water','النسر'));
  if(id==='oilrig'){const r=mkRig('oil','العملاق');r.bit.type=S.pdc?'bitP':'bitT';S.rigs.push(r);}
  if(id==='pdc')S.pdc=true;if(id==='auto')S.autoDrill=true;if(id==='crew')S.crew++;
  toast('تم الشراء',u.n+' · '+money(c),'good');log('شراء: '+u.n+' ('+money(c)+').','good');save();}

/* ======================= SIMULATION ======================= */
function curLedger(){const d=opDay(S.t);let l=S.ledger[S.ledger.length-1];if(!l||l.d!==d){l={d,inc:0,cost:0};S.ledger.push(l);if(S.ledger.length>30)S.ledger.shift();}return l;}
function todayCost(c){curLedger().cost+=c;} function todayInc(c){curLedger().inc+=c;}
function advance(h){while(h>1e-9){const d=Math.min(h,0.05);step(d);h-=d;}}
function step(dt){
  S.t+=dt;
  for(const t of S.trucks)stepTruck(t);
  for(const r of S.rigs)stepRig(r,dt);
  for(const j of S.jobs)if(j.state==='offer'&&j.expires&&S.t>j.expires){j.state='gone';log('انتهى عرض «'+siteById(j.site).name+'» بدون توقيع.','warn');}
  S.jobs=S.jobs.filter(j=>j.state!=='gone');
  const d=Math.floor(S.t/24);if(d>S.lastDay){S.lastDay=d;daily();}
}
function truckTarget(t){return t.mission==='service'?siteById((wellById(t.dest)||{}).site||'depot'):siteById((jobById(t.dest)||{}).site||'depot');}
function stepTruck(t){
  if(t.state==='idle'||S.t<t.t1)return;
  if(t.state==='loading'){t.state='out';t.t0=S.t;t.t1=S.t+t.hours;return;}
  if(t.state==='out'){
    if(t.mission==='supply'){const j=jobById(t.dest);if(j&&j.state==='active'){for(const k of ITEM_KEYS){j.stock[k]+=t.cargo[k];t.cargo[k]=0;}log('«'+t.name+'» فرّغت حمولتها في «'+siteById(j.site).name+'».','good');}}
    t.state='unload';t.t0=S.t;t.t1=S.t+(t.mission==='service'?T_SERVICE:T_UNLOAD);return;
  }
  if(t.state==='unload'){if(t.mission==='service'){const w=wellById(t.dest);if(w){w.cond=100;w.svc=false;log('صيانة بئر «'+siteById(w.site).name+'» اكتملت.','good');}}t.state='back';t.t0=S.t;t.t1=S.t+t.hours;return;}
  if(t.state==='back'){for(const k of ITEM_KEYS){S.depot[k]+=t.cargo[k];t.cargo[k]=0;}t.state='idle';t.mission=null;t.dest=null;}
}
function stepRig(r,dt){
  const R=RIG[r.kind],job=r.jobId?jobById(r.jobId):null;
  if(r.state==='moving'){const p=clamp((S.t-r.t0)/Math.max(1e-4,r.t1-r.t0),0,1);r.x=r.from.x+(r.to.x-r.from.x)*p;r.y=r.from.y+(r.to.y-r.from.y)*p;
    if(p>=1){if(r.home){r.state='idle';r.at='depot';r.home=false;log('«'+r.name+'» وصلت القاعدة.','info');}else{r.state='rigup';r.t0=S.t;r.t1=S.t+R.rigup;r.at=job.site;log('«'+r.name+'» وصلت «'+siteById(job.site).name+'». تركيب الحفارة '+dur(R.rigup)+'.','info');toast('وصلت الحفارة','«'+r.name+'» بـ«'+siteById(job.site).name+'». بلّش التركيب.','good');}}
    return;}
  if(!job)return;
  if(r.state==='rigup'&&S.t>=r.t1){r.state='drilling';log('بدأ الحفر في «'+siteById(job.site).name+'».','good');if(!S.seenCon){S.seenCon=1;toast('بلّش الحفر','افتح صفحة «العمليات» واضبط الثقل والدوران والضخ حسب كل طبقة.','good');}return;}
  if(r.state==='tripping'&&S.t>=r.t1){r.bit={type:r.nextBit,life:100};r.state='drilling';return;}
  if(r.state==='casing'&&S.t>=r.t1){r.state='drilling';return;}
  if(r.state==='wait'&&S.t>=r.t1){r.state='drilling';if(r.after==='stuck'){r.after=null;raise('stuck',job);}return;}
  if(r.state==='drilling')drill(r,job,dt);
}
function setStall(job,reason){if(job.stall===reason)return;job.stall=reason;if(reason){const s=siteById(job.site).name;log('توقف الحفر في «'+s+'»: '+STALL[reason]+'.','bad');toast('توقف الحفر · '+s,STALL[reason]+'. ابعت شحنة إمداد.','bad');}}
function drill(r,job,dt){
  const R=RIG[r.kind],l=layerAt(job,job.depth),fm=FM[l.r],c=ctlOf(r),o=opt(fm),s=siteById(job.site).name;
  if(S.autoDrill&&r.auto!==false){const k=Math.min(1,dt*3);c.wob+=(o.wob-7-c.wob)*k;c.rpm+=(o.rpm+7-c.rpm)*k;c.pump+=(Math.min(100,o.pump+12)-c.pump)*k;}
  else if(OFF&&(r.cut||0)>65&&c.pump<95){c.pump=Math.min(100,c.pump+6*dt);}
  if(job.depth-job.cased>=R.open-1e-6){
    if(job.stock[R.casing]>=1){job.stock[R.casing]--;job.cased=Math.min(job.cased+ITEMS[R.casing].len,job.depth);r.state='casing';r.t1=S.t+R.ctime;setStall(job,null);return;}
    setStall(job,'casing');return;}
  if(r.bit.life<=0){const b=job.stock.bitP>0?'bitP':(job.stock.bitT>0?'bitT':null);if(!b){setStall(job,'bit');return;}
    job.stock[b]--;r.nextBit=b;r.state='tripping';r.t1=S.t+R.trip+job.depth/R.tripRate;setStall(job,null);log('سحب المواسير لتبديل رأس الحفر في «'+s+'» ('+dur(r.t1-S.t)+').','info');return;}
  if(job.lay!==l.from){const first=job.lay===undefined;job.lay=l.from;
    if(!first){log('«'+s+'»: دخلنا '+fm.n+' ('+fm.code+') على '+Math.round(job.depth)+' م.','info');if(S.sel===job.id)toast('طبقة جديدة · '+fm.n,fm.lith+'. المقاومة '+fm.ucs+' ميغاباسكال. عدّل الثقل والدوران.','warn');}}
  if(fm.frac&&!job.flags['l'+l.from]){raise('loss',job);return;}
  if(fm.kick&&!job.flags['k'+l.from]){job.flags['k'+l.from]=1;if(rng()<fm.kick){raise('kick',job);return;}}
  const B=BIT[r.bit.type],e=effAt(c,fm),rop=ropFor(r.kind,r.bit.type,fm,e);
  const mpm=R.mpm*(0.45+c.pump/90)*fracMul(job,l);
  let dm=rop*dt;dm=Math.min(dm,job.target-job.depth,job.cased+R.open-job.depth,l.to-job.depth+0.0001);
  if(job.stock.diesel<dm*R.dpm){setStall(job,'diesel');job.rop=0;return;}
  if(job.stock.mud<dm*mpm){setStall(job,'mud');job.rop=0;return;}
  setStall(job,null);
  job.stock.diesel-=dm*R.dpm;job.stock.mud-=dm*mpm;r.bit.life-=B.wear(fm)*wearMul(c,fm)*dm;
  job.depth+=dm;job.rop=rop;r.e=e;S.stats.meters+=dm;
  const need=o.pump-6+rop*1.5;
  r.cut=clamp((r.cut||0)+(c.pump<need?(need-c.pump)*1.1:-((c.pump-need)*0.8+4))*dt,0,100);
  if(r.cut>=100){r.cut=60;raise('stuck',job);return;}
  if(fm.swell&&c.wob>o.wob+22&&rng()<0.06*fm.swell*dt){raise('stuck',job);return;}
  if(fm.aq&&job.kind==='water'&&!job.flags.w){job.flags.w=1;log('وصلنا لخزان المياه الجوفي ('+fm.n+') في «'+s+'» على '+Math.round(job.depth)+' م.','good');toast('ماء!','الحفر دخل خزان '+fm.code+' في «'+s+'».','good');}
  if(fm.oil&&!job.flags.o){job.flags.o=1;log('ظهور زيت في عيّنات الحفر ب«'+s+'».','good');toast('ظهور نفط','العيّنات من «'+s+'» فيها زيت.','good');}
  if(r.bit.life<=0)log('رأس الحفر في «'+s+'» انتهى عمره بعد '+fm.n+'.','warn');
  const open=job.depth-job.cased;
  if(fm.cave&&open>12&&rng()<0.04*dt){const loss=Math.min(rr(2,6),open-1);job.depth-=loss;log('انهيار جزئي لجدار البئر في «'+s+'» (−'+loss.toFixed(1)+' م). الرسوبيات المفككة بدها تغليف بكير.','bad');}
  if(job.depth>=job.target-1e-6)complete(job,r);
}
function complete(job,r){
  job.depth=job.target;job.state='done';job.doneAt=S.t;
  const late=S.t>job.deadline,early=job.deadline-S.t>48;const pay=late?Math.round(job.reward*0.6):Math.round(job.reward*(early?1.1:1));
  S.cash+=pay;todayInc(pay);S.stats.earned+=pay;S.stats.done++;S.rep=clamp(S.rep+(late?-1:1),0,5);
  const s=siteById(job.site);
  S.wells.push({id:nid('W'),site:job.site,kind:job.kind,cond:100,depth:job.target,built:S.t,client:job.client,income:job.kind==='oil'?1500:Math.round(60+job.target*0.3),svc:false});
  let back=false;for(const k of ITEM_KEYS){if(job.stock[k]>0.5){S.depot[k]+=Math.floor(job.stock[k]);back=true;}job.stock[k]=0;}
  r.state='idle';r.jobId=null;r.at=job.site;job.rig=null;
  log('اكتمل بئر «'+s.name+'» على '+job.target+' م. الدفعة '+money(pay)+(late?' (متأخر −40%)':early?' (تسليم مبكر +10%)':'')+'.','good');
  if(back)log('المواد الفائضة رجعت للمستودع.','info');
  toast('اكتمل البئر · '+s.name,money(pay)+(late?' · التأخير خفّض السمعة':' · السمعة +1'),late?'warn':'good');save();
}
function dailyNet(){let inc=0;for(const w of S.wells)inc+=w.income*(w.cond>=40?1:0.35);let wg=S.trucks.length*60;for(const r of S.rigs)wg+=r.state==='idle'&&r.at==='depot'?RIG[r.kind].wage*.4:RIG[r.kind].wage;return{inc,wg};}
function daily(){
  const {inc,wg}=dailyNet();S.cash+=inc-wg;todayInc(inc);todayCost(wg);
  for(const w of S.wells)w.cond=Math.max(0,w.cond-(w.kind==='oil'?3.2:2.4));
  for(const j of S.jobs)if(j.state==='active'&&S.t>j.deadline&&!j.flags.late){j.flags.late=1;log('تجاوزنا مهلة عقد «'+siteById(j.site).name+'». الدفعة رح تنقص 40%.','bad');}
  for(const w of S.wells){if(w.cond<40&&!w.warned){w.warned=1;log('بئر «'+siteById(w.site).name+'» يحتاج صيانة. الدخل نازل.','warn');}else if(w.cond>=40)w.warned=0;}
  if(S.jobs.filter(j=>j.state==='offer').length<5&&rng()<0.75)genContract();
  if(S.cash<0)toast('الرصيد بالسالب','الرواتب مستمرة. سلّم عقد بسرعة.','bad');
}

const INC_SECS=45;
const INC={
  kick:{t:'اندفاع ضغط بالبئر!',d:'سوائل الطبقة دخلت البئر وضغط المواسير عم يطلع. إذا ما سكّرت بسرعة ممكن يصير انفجار.',crew:'choke',ch:[

    {k:'go',n:'تجاهل وكمّل حفر',s:'خطر انفجار البئر وغرامة',bad:1}]},
  stuck:{t:'علقت المواسير!',d:'القطع الصخرية والطين المنتفخ مسكوا المواسير. لازم تحررها قبل ما تنحبس.',crew:'oil',ch:[
    {k:'jar',n:'شدّ واهتزاز (جار)',s:'ساعة · نجاح 55%'},
    {k:'oil',n:'ضخ زيت تحرير وانتظر',s:'20 كيس طين · 5 ساعات · نجاح 85%'},
    {k:'side',n:'اقطع واحفر جانبي',s:'مضمون · تخسر لحد 20 م ورأس الحفر · 12 ساعة',bad:1}]},
  loss:{t:'فقدان دوران الطين',d:'الطين عم يهرب بشقوق الصخر. الاستهلاك تضاعف وإذا ما عالجته رح يخلص مخزونك.',crew:'low',ch:[
    {k:'lcm',n:'ضخ مواد سدّ (LCM)',s:'30 كيس طين · ساعتين · الاستهلاك يرجع ×1.2'},
    {k:'low',n:'خفّف الضخ وكمّل',s:'الاستهلاك ×2 · خطر تراكم القطع'},
    {k:'ign',n:'كمّل متل ما إنت',s:'الاستهلاك يضل عالي',bad:1}]},
};
function raise(type,job){
  const r=rigById(job.rig);if(!r)return;
  if(type==='loss')job.flags['l'+layerAt(job,job.depth).from]='seen';
  r.state='inc';log('طارئ في «'+siteById(job.site).name+'»: '+INC[type].t,'bad');
  if(OFF||S.inc||document.hidden){applyChoice(job,r,INC[type].crew,true);return;}
  S.inc={type,job:job.id,until:Date.now()+INC_SECS*1000};S.sel=job.id;showIncident(true);
}
function showIncident(fresh){
  const I=S.inc,el=$('#incident');if(!I){el.hidden=true;el.innerHTML='';return;}
  const D0=INC[I.type],job=jobById(I.job);if(!job){S.inc=null;el.hidden=true;return;}
  el.innerHTML='<div class="icard'+(fresh?' shake':'')+'" role="alertdialog" aria-modal="true" aria-labelledby="inc-t"><div class="hazard"></div><div class="body">'+
    '<div class="row"><h3 id="inc-t">'+D0.t+'</h3><span class="chip bad">'+esc(siteById(job.site).name)+' · '+Math.round(job.depth)+' م</span></div><p>'+D0.d+'</p>'+
    '<div><div class="row muted" style="font-size:13px"><span>الوقت للقرار</span><span class="num" id="inc-s"></span></div><div class="timer"><i id="inc-bar" style="width:100%"></i></div></div>'+
    D0.ch.map(c=>'<button class="choice'+(c.bad?' risky':'')+'" data-act="inc" data-v="'+c.k+'">'+c.n+'<small>'+c.s+'</small></button>').join('')+
    '<div class="muted" style="font-size:13px">إذا ما قررت، رئيس الطاقم بيختار: «'+D0.ch.find(c=>c.k===D0.crew).n+'»</div></div></div>';
  el.hidden=false;
}
function resolveInc(k){const I=S.inc;if(!I)return;S.inc=null;$('#incident').hidden=true;$('#incident').innerHTML='';const job=jobById(I.job);if(!job||job.state!=='active')return;const r=rigById(job.rig);if(r)applyChoice(job,r,k,false);}
function applyChoice(job,r,k,crew){
  const l=layerAt(job,job.depth),c=ctlOf(r),o=opt(FM[l.r]),s=siteById(job.site).name,pre=crew?'رئيس الطاقم تصرّف: ':'';
  const wait=(h,txt)=>{r.state='wait';r.t1=S.t+h;r.waitTxt=txt;};r.state='drilling';
  switch(k){
    case 'bop':{const u=Math.min(40,job.stock.mud);job.stock.mud-=u;wait(u<40?6:3,'سيطرة على الضغط');log(pre+'سكّرنا مانع الانفجار في «'+s+'» وثقّلنا الطين.','good');toast('تحت السيطرة','قرار صح. الضغط رجع طبيعي.','good');break;}
    case 'choke':wait(8,'تنفيس الضغط');log(pre+'تنفيس الضغط عبر الخانق في «'+s+'» (8 ساعات).','warn');break;

  if(!r)return '<span class="chip warn">بانتظار حفارة</span>';if(r.state==='moving')return '<span class="chip mut">الحفارة بالطريق</span>';if(r.state==='rigup')return '<span class="chip mut">تركيب الحفارة</span>';
  if(r.state==='inc')return '<span class="chip bad">طارئ</span>';if(job.stall)return '<span class="chip bad">متوقف</span>';if(r.state==='wait')return '<span class="chip warn">'+esc(r.waitTxt||'معالجة')+'</span>';
  if(r.state==='tripping')return '<span class="chip warn">تبديل رأس</span>';if(r.state==='casing')return '<span class="chip mut">تغليف</span>';return '<span class="chip hv">يحفر</span>';
}
function deadlineTxt(job){const left=job.deadline-S.t;return left<0?'<span style="color:var(--bad)">متأخر '+dur(-left)+'</span>':dur(left);}
function fmList(job,kind){return '<div class="fmlist">'+layerPlan(job,kind).map(p=>{const fm=p.fm,risks=[];if(fm.aq)risks.push('خزان مياه');if(fm.frac)risks.push('فقدان طين');if(fm.swell)risks.push('علق مواسير');if(fm.kick)risks.push('اندفاع ضغط');if(fm.cave)risks.push('انهيار');if(fm.abr>.7)risks.push('بيآكل الرؤوس');if(fm.oil)risks.push('نفط');
  return '<div class="fm"><i style="background:'+fm.c+'"></i><div><b>'+fm.n+'</b> <span class="muted num" style="font-size:12px">'+fm.code+'</span><small>'+fm.lith+' · مقاومة '+fm.ucs+' MPa</small>'+(risks.length?'<span class="rk">'+risks.join(' · ')+'</span>':'')+'</div><div style="text-align:left"><b class="num">'+p.a+'–'+p.b+' m</b><small class="num">~'+p.rop.toFixed(1)+' m/h · '+dur(p.h)+'</small></div></div>';}).join('')+'</div>';}
function hint(){
  const act=S.jobs.filter(j=>j.state==='active');
  if(!act.length){const o=S.jobs.filter(j=>j.state==='offer'&&!canAccept(j)).sort((a,b)=>kmBetween(DEPOT,siteById(a.site))-kmBetween(DEPOT,siteById(b.site)))[0];
    if(o)return['اقبل عقداً من «العقود». الأقرب: «'+siteById(o.site).name+'» ('+o.target+' م).','<button class="btn pri sm" data-act="page" data-v="contracts">افتح العقود</button>'];return['ما في عروض هلأ. العروض الجديدة بتوصل كل يوم تقريباً.',''];}
  for(const j of act)if(!j.rig){const r=S.rigs.find(r=>r.kind===jobRigKind(j)&&!r.jobId&&r.state==='idle');if(r)return['ابعت الحفارة «'+r.name+'» إلى «'+siteById(j.site).name+'».','<button class="btn pri sm" data-act="sendrig" data-v="'+j.id+'" data-rig="'+r.id+'">ابعت الحفارة</button>'];}
  const idle=S.trucks.some(t=>t.state==='idle');
  for(const j of act)if(j.stall)return['«'+siteById(j.site).name+'» متوقف: '+STALL[j.stall]+'.',idle?'<button class="btn pri sm" data-act="dispatch" data-job="'+j.id+'">ابعت شحنة</button>':''];
  for(const j of act){const rc=reach(j),tr=inTransit(j.id),rem=j.target-j.depth;const short=Math.min(rc.diesel,rc.mud,rc.casing,rc.bits)<rem-0.5;if(short&&!ITEM_KEYS.some(k=>tr[k]>0))return['مخزون «'+siteById(j.site).name+'» ما بيكفي لآخر البير. ابعت شحنة قبل ما يوقف الحفر.',idle?'<button class="btn pri sm" data-act="dispatch" data-job="'+j.id+'">ابعت شحنة</button>':''];}
  for(const j of act){const r=j.rig&&rigById(j.rig);if(r&&r.state==='drilling'&&!j.stall&&effAt(ctlOf(r),FM[layerAt(j,j.depth).r])<.6&&!(S.autoDrill&&r.auto!==false))return['الحفر بـ«'+siteById(j.site).name+'» بطيء. اضبط الثقل والدوران من «العمليات».','<button class="btn sm" data-act="sel" data-v="'+j.id+'">افتح المنصة</button>'];}
  return['كل شي ماشي. الحفر بيكمّل لحاله حتى لو سكّرت الصفحة.',''];
}

function openMenu(){D={menu:1};$('#modal').innerHTML='<div class="mcard" role="dialog" aria-modal="true"><header><h3>عُمق · طريقة اللعب</h3></header><div class="body">'+
  '<div style="line-height:1.9">١. <b>الوقت حقيقي.</b> الساعة باللعبة هي ساعتك، والحفر بيكمّل وإنت مسكّر الصفحة.<br>٢. اقبل عقد. كل موقع إله طبقات أرض حقيقية: البازلت والصوّان بطيئين وبياكلوا الرؤوس، والطباشير والرسوبيات سريعة.<br>٣. ابعت الحفارة (الترحيل بين 10 و40 دقيقة) وبعدين شاحنات بالديزل والطين والمواسير والرؤوس.<br>٤. من «العمليات» اضبط الثقل والدوران والضخ لكل طبقة. الطوارئ بتطلب قرارك خلال 45 ثانية، وإذا كنت غايب رئيس الطاقم بيتصرف.<br>٥. سلّم بالمهلة ترفع سمعتك. 3 نجوم وحفارة نفط بيفتحولك حقول النفط.</div>'+
  '<div class="sec-t">الحفظ</div>'+(FB.on?fbMenuHTML()+'<div style="height:12px"></div>':'<div class="muted" style="font-size:14px;margin-bottom:12px">'+({ok:'لعبتك محفوظة أونلاين على حسابك. افتح نفس الرابط من الموبايل أو الكمبيوتر وبتكمّل نفس اللعبة.',wait:'عم يتصل بالحفظ الأونلاين…',err:'الحفظ الأونلاين متوقف هلأ. اللعبة محفوظة على هالجهاز وبترجع تتزامن لحالها.',off:'الحفظ الأونلاين مش متاح هون (لازم تكون مسجّل دخول). اللعبة محفوظة على هالجهاز بس.'}[CLOUD.state]||'')+'</div>')+'<div class="sec-t">لعبة جديدة</div><div class="btns"><button class="btn" data-act="reset1">ابدأ من الصفر</button></div></div><footer><button class="btn pri" data-act="d-close">رجوع</button></footer></div>';$('#modal').hidden=false;}
function showAway(gapH,before,cash0){
  const items=S.log.filter(l=>l.t>before).slice(0,14);if(!items.length&&Math.abs(S.cash-cash0)<1)return;D={away:1};
  $('#modal').innerHTML='<div class="mcard" role="dialog" aria-modal="true"><header><h3>أثناء غيابك</h3><span class="muted">'+dur(gapH)+'</span></header><div class="body"><div class="facts"><div class="fact"><label>تغيّر الرصيد</label><b class="num" style="color:'+(S.cash>=cash0?'var(--good)':'var(--bad)')+'">'+(S.cash>=cash0?'+':'')+money(S.cash-cash0)+'</b></div></div><div class="loglist">'+items.map(l=>'<div class="'+l.kind+'"><time>'+stamp(l.t)+'</time><span>'+esc(l.msg)+'</span></div>').join('')+'</div></div><footer><button class="btn pri" data-act="d-close">تمام</button></footer></div>';$('#modal').hidden=false;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,v=b.dataset.v;
  switch(a){
    case 'page':go(v);return;
    case 'sel':S.sel=v;S.focus=null;go('ops');return;
    case 'stage-job':S.sel=v;S.focus=null;break;
    case 'viewsite':S.sel=v;S.focus=null;$('#main').scrollTo({top:0,behavior:'smooth'});break;
    case 'focus':S.focus={type:b.dataset.type,id:v};$('#main').scrollTo({top:0,behavior:'smooth'});break;
    case 'accept':acceptJob(v);break;
    case 'sendrig':sendRig(v,b.dataset.rig);break;
    case 'home':rigHome(v);break;
    case 'buy':buy(b.dataset.item,+b.dataset.q);break;
    case 'upg':buyUpg(v);break;
    case 'service':serviceWell(v);break;
    case 'inc':resolveInc(v);return;
    case 'dispatch':openDispatch({truck:b.dataset.truck,job:b.dataset.job});return;
    case 'menu':FB.msg='';openMenu();return;
    case 'fb-in':fbAuth('in');return;
    case 'fb-up':fbAuth('up');return;
    case 'fb-reset':fbAuth('reset');return;
    case 'fb-out':fbAuth('out');return;
    case 'cl-remote':fbChoose(true);return;
    case 'cl-local':fbChoose(false);return;
    case 'drawer':$('#drawer').hidden=false;S.seenLog=S.t;setHTML('drawer-log',logHTML(120));return;
    case 'drawer-close':$('#drawer').hidden=true;return;
    case 'reset1':b.textContent='متأكد؟ اضغط كمان مرة لمسح كل التقدم';b.dataset.act='reset2';b.classList.add('pri');return;
    case 'reset2':try{localStorage.removeItem(KEY);}catch(_){}newGame();closeModal();sceneKey='';builtKey='';toast('لعبة جديدة','بالتوفيق يا مدير.','good');save(true);return;
    case 'd-close':closeModal();return;
    case 'd-truck':D.truck=v;suggest();renderModal();return;
    case 'd-job':D.job=v;suggest();renderModal();return;
    case 'd-suggest':suggest();renderModal();return;
    case 'd-inc':case 'd-dec':{const k=b.dataset.k;D.cargo[k]=clamp(D.cargo[k]+(a==='d-inc'?ITEMS[k].step:-ITEMS[k].step),0,Math.floor(S.depot[k]));renderModal();return;}
    case 'd-send':{if(dispatch(D.truck,D.job,D.cargo)){const j=jobById(D.job),t=D.truck;closeModal();S.focus={type:'truck',id:t};toast('الشاحنة انطلقت','إلى «'+siteById(j.site).name+'»','good');}return;}
  }
  dirty();
});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.ctl;if(!k)return;const r=rigById(e.target.dataset.rig);if(!r)return;ctlOf(r)[k]=+e.target.value;const j=r.jobId&&jobById(r.jobId);if(j)renderConsole(j);});
document.addEventListener('change',e=>{if(e.target.id!=='c-auto')return;const r=rigById(e.target.dataset.rig);if(r){r.auto=e.target.checked;}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(D)closeModal();if(!$('#drawer').hidden)$('#drawer').hidden=true;}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save(true);});
window.addEventListener('pagehide',()=>save(true));

/* ======================= LOOP ======================= */
let lastUI=0,lastSave=0,lastSky=null;
function tick(){
  const now=Date.now();const dH=(now-S.wall)/3.6e6*SCALE;S.wall=now;
  if(dH>0){if(dH/SCALE*3600>20){OFF=true;advance(Math.min(dH,24*30));OFF=false;dirty();}else advance(dH);}
  if(S.inc){const left=(S.inc.until-now)/1000;const b=$('#inc-bar');if(b){b.style.width=clamp(left/INC_SECS*100,0,100)+'%';$('#inc-s').textContent=Math.max(0,Math.ceil(left))+'s';}if(left<=0)resolveInc(INC[S.inc.type].crew);}
  if(now-lastSave>20000){lastSave=now;save();}
}
function frame(t){
  try{tick();}catch(err){console.error(err);}
  const busy=performance.now()-touchAt<350;
  if(stageVis&&!document.hidden&&!(busy&&LOWP)&&(!LOWP||t-last3D>=31)){last3D=t;try{lastSky=render3D(t)||lastSky;}catch(err){console.error(err);}}
  if(!LOWP||t-lastCv>=100){lastCv=t;drawMap(t);drawXsec(t);}
  if(needsRender||t-lastUI>400){needsRender=false;lastUI=t;renderAll(lastSky);}
  requestAnimationFrame(frame);
}
let booted=false;
function boot(data){
  if(booted){if(data&&data.state&&data.state.v===3){S=data.state;sceneKey='';builtKey='';dirty();}return;}booted=true;
  const L0=load();CLOUD.localWall=L0&&L0.wall||0;
  S=(data&&data.state&&data.state.v===3?data.state:null)||L0||newGame();
  if(!S.sel||!jobById(S.sel)){const a=S.jobs.find(j=>j.state==='active')||S.jobs.find(j=>j.state==='offer');S.sel=a?a.id:null;}
  const before=S.t,cash0=S.cash,gapH=Math.max(0,(Date.now()-S.wall)/3.6e6*SCALE);
  if(gapH>0){OFF=true;advance(Math.min(gapH,24*30));OFF=false;}S.wall=Date.now();
  if(S.inc&&Date.now()>S.inc.until)resolveInc(INC[S.inc.type].crew);else if(S.inc)showIncident(false);
  try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({state:S}));}catch(_){}
  buildNav();buildTerrain();init3D();save();setTimeout(cloudInit,0);
  if(gapH>0.2)showAway(gapH,before,cash0);
  requestAnimationFrame(frame);
  hideSplash();
}
const T0=Date.now();
function hideSplash(now){const e=document.getElementById('splash');if(!e||e.classList.contains('out'))return;const wait=now?0:Math.max(0,1600-(Date.now()-T0));setTimeout(()=>{e.classList.add('out');setTimeout(()=>e.remove(),700);},wait);}
/* Show the result of a tap right away instead of waiting for the next animation frame. */
document.addEventListener('click',()=>{if(!needsRender)return;needsRender=false;frozen=false;try{renderAll(lastSky);}catch(err){console.error(err);}});
document.getElementById('splash').addEventListener('click',()=>{if(booted)hideSplash(true);});
const HOT=window.claude&&window.claude.hot;
try{if(HOT&&HOT.ready)HOT.ready(boot);}catch(_){}
setTimeout(()=>{if(!booted)boot((HOT&&HOT.data)||{});},HOT&&HOT.ready?400:0);
})();
</script>

<script>
if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
